<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Proxy Screen</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .search-container { margin-bottom: 20px; display: flex; gap: 10px; width: 80%; max-width: 600px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: none; font-size: 16px; background: #222; color: white; }
        button { padding: 15px 25px; border-radius: 8px; border: none; font-size: 16px; cursor: pointer; background: #007bff; color: white; font-weight: bold; }
        iframe { width: 90%; height: 70vh; border: 2px solid #333; border-radius: 12px; background: white; }
    </style>
</head>
<body>
    <h1>🌐 Custom Proxy Search</h1>
    <div class="search-container">
        <input type="text" id="url-input" placeholder="Enter full URL link to search...">
        <button id="go-btn">Go</button>
    </div>
    <iframe id="proxy-frame" src="about:blank"></iframe>

    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script>
        const input = document.getElementById('url-input');
        const button = document.getElementById('go-btn');
        const frame = document.getElementById('proxy-frame');

        navigator.serviceWorker.register('/uv/uv.sw.js', {
            scope: __uv$config.prefix
        }).then(() => {
            button.addEventListener('click', () => {
                let url = input.value.trim();
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                frame.src = __uv$config.prefix + __uv$config.encodeUrl(url);
            });
        });
    </script>
</body>
</html>
