<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>
    <!-- real favicon link that our script will dynamically replace -->
    <link rel="icon" type="image/x-icon" href="https://gstatic.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: #1e1e1e;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #2d2d2d;
            z-index: 10;
        }
        .search-container {
            display: flex;
            flex-grow: 1;
            gap: 10px;
        }
        input {
            flex-grow: 1;
            padding: 8px 14px;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #4caf50;
        }
        button {
            padding: 8px 16px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        button:hover {
            background-color: #45a049;
        }
        .frame-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <div class="search-container">
            <input type="text" id="proxy-address-bar" placeholder="Enter a URL to browse invisibly (e.g., google.com)...">
            <button id="proxy-launch-btn">Go</button>
        </div>
    </header>

    <div class="frame-container">
        <iframe id="proxy-viewframe" src="about:blank"></iframe>
    </div>

    <script>
        // 🎭 1. THE AUTOMATED TAB CLOAKING DISGUISE
        function applyTabCloak() {
            // Mask the tab text title
            document.title = "Google Docs - Language Arts Assignment";
            
            // Mask the tab favicon to look exactly like Google Docs
            let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon';
            link.rel = 'shortcut icon';
            link.href = 'https://gstatic.com';
            document.getElementsByTagName('head')[0].appendChild(link);
        }
        
        // Trigger the cloak immediately when the window renders
        window.onload = applyTabCloak;

        // 🚀 2. THE BASE64 GATEWAY SEARCH ROUTING ENGINE
        const addressBar = document.getElementById('proxy-address-bar');
        const launchBtn = document.getElementById('proxy-launch-btn');
        const viewFrame = document.getElementById('proxy-viewframe');

        function executeSearch() {
            let targetUrl = addressBar.value.trim();
            if (!targetUrl) return;

            // Automatically prepend protocol headers if missing
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }

            // Cleanly format the absolute window route using local root path mapping
            const rootDomain = window.location.origin;
            const finalizedRoute = rootDomain + "/service/" + btoa(targetUrl);
            
            // Render the unblocked destination smoothly inside your interface layout frame
            viewFrame.src = finalizedRoute;
        }

        // Listen for standard mouse clicks and keyboard 'Enter' presses
        launchBtn.addEventListener('click', executeSearch);
        addressBar.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                executeSearch();
            }
        });
    </script>
</body>
</html>
